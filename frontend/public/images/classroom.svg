<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" fill="none">
  <defs>
    <linearGradient id="classWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#EEE9DE" />
    </linearGradient>
  </defs>
  <!-- Background with warm coaching classroom interior -->
  <rect width="900" height="600" rx="20" fill="url(#classWarm)" />
  
  <!-- Blackboard / classroom focus area in background -->
