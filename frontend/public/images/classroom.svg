  <text x="120" y="125" font-family="'Inter', sans-serif" font-size="16" fill="#A8BFBA" opacity="0.8">F = dp/dt • ∫ v dt • λ = h/p • Batch 2026-27</text>
  <text x="120" y="165" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#FAF8F4">Unit Test 04 — Mechanical Energy &amp; Wave Optics</text>
  <text x="120" y="205" font-family="'Inter', sans-serif" font-size="14" fill="#D98A1E">Next Session: 10:00 AM • Room 3B, Jaipur Main Centre</text>

  <!-- Classroom study desks -->
  <rect x="140" y="380" width="620" height="30" rx="4" fill="#D2C8B8" />
  <rect x="160" y="410" width="16" height="150" fill="#8C8476" />
  <rect x="724" y="410" width="16" height="150" fill="#8C8476" />

