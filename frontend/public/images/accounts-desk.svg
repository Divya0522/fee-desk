  <line x1="135" y1="375" x2="310" y2="375" stroke="#E2E8F0" stroke-width="2" />
  <line x1="135" y1="395" x2="310" y2="395" stroke="#E2E8F0" stroke-width="2" />
  <line x1="135" y1="415" x2="260" y2="415" stroke="#E2E8F0" stroke-width="2" />

  <!-- Calculator / terminal -->
  <rect x="380" y="340" width="110" height="100" rx="8" fill="#14211F" />
  <rect x="392" y="352" width="86" height="24" rx="3" fill="#2E4A43" />
  <text x="400" y="369" font-family="'Inter', monospace" font-size="12" fill="#FAF8F4">₹15,000</text>
  <circle cx="405" cy="395" r="5" fill="#4A5654" />
  <circle cx="425" cy="395" r="5" fill="#4A5654" />
  <circle cx="445" cy="395" r="5" fill="#4A5654" />
  <circle cx="465" cy="395" r="5" fill="#D98A1E" />
  <circle cx="405" cy="415" r="5" fill="#4A5654" />
