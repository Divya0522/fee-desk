  <circle cx="445" cy="415" r="5" fill="#4A5654" />
  <circle cx="465" cy="415" r="5" fill="#1F7A4D" />

  <!-- Stamp / Seal (FeeDesk Verified) -->
  <circle cx="560" cy="390" r="32" stroke="#0E4D44" stroke-width="2" stroke-dasharray="4 2" fill="#E6F0EE" />
  <text x="536" y="388" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0E4D44">FEEDESK</text>
